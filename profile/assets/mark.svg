<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="NextCore">
  <defs>
    <linearGradient id="nc-pink" x1="12%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#FF7AAD"/>
      <stop offset="50%" stop-color="#F41469"/>
      <stop offset="100%" stop-color="#C8177B"/>
    </linearGradient>
    <style>
      .bars { transform-origin: 128px 128px; }
      .b { animation: nc-float 3.4s ease-in-out infinite; }
      .b:nth-child(2) { animation-delay: 0.15s; }
      .b:nth-child(3) { animation-delay: 0.3s; }
      @keyframes nc-float {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(2px, -4px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .b { animation: none; }
      }
    </style>
  </defs>
  <rect width="256" height="256" rx="64" fill="#131A24"/>
  <g class="bars" fill="url(#nc-pink)" transform="translate(40 38) rotate(-22 88 90)">
    <rect class="b" x="18" y="0" width="156" height="42" rx="21"/>
    <rect class="b" x="18" y="58" width="156" height="42" rx="21"/>
    <rect class="b" x="0" y="116" width="174" height="42" rx="21"/>
  </g>
</svg>
